# Reduce idle object-store listings; deletion eligibility and sync cadence are unchanged.
l0-retention-check-interval: 5m
# Private container-local IPC for startup replica initialization.
socket:
  enabled: true
  path: /run/litestream.sock
  permissions: 0600
# Litestream 0.5.x configuration (single `replica:` key; 0.3.x used a `replicas:` list).
# The entrypoint validates the variables and sets the optional ones before Litestream reads
# this file. The credentials are not written here: Litestream reads LITESTREAM_ACCESS_KEY_ID
# and LITESTREAM_SECRET_ACCESS_KEY from the environment itself.
# A custom endpoint (R2, MinIO) selects path-style addressing automatically.
# Production replicates data.db only. In explicit demo mode the entrypoint
# generates /run/vaultcontext-demo-litestream.yml and appends auxiliary.db at
# ${LITESTREAM_PATH}/auxiliary in the same disposable replica bucket.
dbs:
  - path: /storage/pb_data/data.db
    replica:
      type: s3
      bucket: "${LITESTREAM_BUCKET}"
      path: "${LITESTREAM_PATH}"
      region: "${LITESTREAM_REGION}"
      endpoint: "${LITESTREAM_ENDPOINT}"
      sync-interval: "${LITESTREAM_SYNC_INTERVAL}"
